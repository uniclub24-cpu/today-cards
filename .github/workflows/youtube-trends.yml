name: YouTube trends

on:
  workflow_dispatch:
  schedule:
    - cron: "41 22 * * *"   # 매일 07:41 (한국시간)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 인기 영상 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/yt_trends.py 30 10
      - name: 저장
        run: |
          git config user.name "today-bot"
          git config user.email "today-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "유튜브 인기 영상 수집 [skip ci]" && git pull --rebase -q && git push)
